<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Cyan to Royal Blue) -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Glass Rim Highlight Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
    </linearGradient>

    <!-- Inner Radial Glow for Depth -->
    <radialGradient id="innerGlow" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for the Bolt -->
    <filter id="boltShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0c4a6e" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>

    <!-- Subtle Wave / Radar Pulse Ring Gradient -->
    <linearGradient id="radarRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Outer Squircle with Rich Brand Gradient -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#brandGrad)" />
  
  <!-- Subtle Top-Light Radial Illumination -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#innerGlow)" />

  <!-- Ultra-Crisp Glass Rim Stroke -->
  <rect x="34" y="34" width="444" height="444" rx="110" fill="none" stroke="url(#rimGrad)" stroke-width="4" />

  <!-- Radar / P2P Orbit Accents (Minimalist & Sleek) -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#radarRing)" stroke-width="3" stroke-dasharray="12 12" opacity="0.65" />
  <circle cx="256" cy="256" r="136" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2" />

  <!-- Dynamic BlinkDrop P2P Teleport Dots -->
  <circle cx="376" cy="136" r="7" fill="#ffffff" opacity="0.85" />
  <circle cx="136" cy="376" r="5" fill="#ffffff" opacity="0.65" />

  <!-- Iconic Pure White Lightning Bolt (Zap) with Smooth Rounded Joints -->
  <path
    d="M272 96 L132 272 H256 L240 416 L380 240 H256 Z"
    fill="#ffffff"
    stroke="#ffffff"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#boltShadow)"
  />

  <!-- High-Gloss Specular Core Highlight on Bolt -->
  <path
    d="M266 120 L156 260 H256 L244 380 L356 248 H256 Z"
    fill="#f0fdf4"
    opacity="0.25"
  />
</svg>
